name: Build & Release APK

on:
  push:
    branches: [ main, master ]
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - '.gitattributes'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        run: |
          SDK="$RUNNER_TEMP/android-sdk"
          mkdir -p "$SDK/cmdline-tools"
          curl -sSLo /tmp/cmdline.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/cmdline.zip -d "$RUNNER_TEMP/ct"
          mv "$RUNNER_TEMP/ct/cmdline-tools" "$SDK/cmdline-tools/latest"
          yes 2>/dev/null | "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" --licenses > /dev/null 2>&1 || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" "platforms;android-33" "build-tools;33.0.2" > /dev/null
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"

      - name: Restore keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::缺少 KEYSTORE_BASE64 密钥，无法保证与设备上版本签名一致"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | tr -d '\r\n ' | base64 -d > keystore.jks
          ls -l keystore.jks

      - name: Build APK
        env:
          REQUIRE_KEYSTORE: '1'
          KS_PASS: ${{ secrets.KS_PASS }}
          KEY_PASS: ${{ secrets.KS_PASS }}
          KS_ALIAS: sb
        run: bash build.sh

      - name: Read version
        id: ver
        run: |
          VC=$(grep -oP 'versionCode="\K[0-9]+' AndroidManifest.xml)
          VN=$(grep -oP 'versionName="\K[^"]+' AndroidManifest.xml)
          echo "code=$VC" >> "$GITHUB_OUTPUT"
          echo "name=$VN" >> "$GITHUB_OUTPUT"
          echo "构建版本 v$VN ($VC)"

      - name: Prepare release assets
        run: |
          mkdir -p out
          cp StudyBoard.apk out/StudyBoard.apk
          SIZE=$(stat -c%s out/StudyBoard.apk)
          cat > out/update.json <<EOF
          {
            "versionCode": ${{ steps.ver.outputs.code }},
            "versionName": "${{ steps.ver.outputs.name }}",
            "apk": "StudyBoard.apk",
            "size": $SIZE,
            "builtAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "commit": "${{ github.sha }}"
          }
          EOF
          cat out/update.json

      - name: Delete same-version release if exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release delete "v${{ steps.ver.outputs.name }}" --yes --cleanup-tag || true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.name }}
          name: v${{ steps.ver.outputs.name }}
          body: |
            自动构建 v${{ steps.ver.outputs.name }}（versionCode ${{ steps.ver.outputs.code }}）
            commit: ${{ github.sha }}
          files: |
            out/StudyBoard.apk
            out/update.json
          draft: false
          prerelease: false
          make_latest: true
